<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VITA Randevu">
<meta name="theme-color" content="#1f3a34">
<meta name="robots" content="noindex, nofollow">
<title>VITA Randevu</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2321;--mute:#6b736f;--line:#e3dfd6;--acc:#1f3a34;--acc2:#2f6b5c;--ok:#2f7d4f;--warn:#b7791f;--bad:#b23b3b;--chip:#eef3f1;--full:#f6e3e3;--free:#e3f2e8}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--acc);color:#fff;padding:10px 16px calc(10px) 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header b{font-size:17px;letter-spacing:.3px}header .who{margin-left:auto;font-size:13px;opacity:.85}
header button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:4px 10px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:46px;z-index:4}
nav button{border:0;background:transparent;padding:7px 12px;border-radius:999px;white-space:nowrap;color:var(--mute)}
nav button.on{background:var(--acc);color:#fff}
main{max-width:1180px;margin:0 auto;padding:14px 16px 80px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar .grow{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;color:var(--ink)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.d{color:var(--bad);border-color:#e7c3c3}.btn.s{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:#fff;color:var(--ink);max-width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mute{color:var(--mute);font-size:13px}.tag{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--acc)}
.tag.w{background:#fbefd9;color:var(--warn)}.warn{color:var(--warn);background:#fbefd9;padding:6px 8px;border-radius:6px}.tag.b{background:var(--full);color:var(--bad)}.tag.g{background:var(--free);color:var(--ok)}
.occ{height:6px;background:#eee;border-radius:9px;overflow:hidden;width:120px}.occ i{display:block;height:100%;background:var(--acc2)}
.occ.full i{background:var(--bad)}
.part{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--line);flex-wrap:wrap}
.part .n{flex:1;min-width:140px}.part.c .n{text-decoration:line-through;color:var(--mute)}
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow-x:auto}
.week .col{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;min-height:120px}
.week .col h4{margin:0 0 6px;font-size:13px;color:var(--mute);font-weight:600;cursor:pointer}
.week .s{border-radius:8px;padding:5px 7px;margin-bottom:5px;font-size:12.5px;cursor:pointer;background:var(--free)}
.week .s.full{background:var(--full)}.week .s.part{background:#fff6e0}
.week ol.wk{margin:3px 0 0 16px;padding:0;font-size:12px}.week ol.wk li{margin:1px 0}
table{border-collapse:collapse;width:100%}td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--mute);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mute)}label.f>*{color:var(--ink)}
dialog{border:0;border-radius:14px;padding:0;width:min(560px,94vw);max-height:90vh;box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,30,28,.45)}
dialog .h{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600;display:flex;align-items:center}
dialog .h button{margin-left:auto}
dialog .b{padding:14px 16px;overflow:auto;max-height:calc(90vh - 120px)}
dialog .ft{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;z-index:99;max-width:92vw}
#toast.on{opacity:1}#toast.bad{background:var(--bad)}
.login{max-width:380px;margin:12vh auto;padding:0 16px}
.login .card{padding:22px}
.days{display:flex;gap:6px;flex-wrap:wrap}.days label{display:flex;gap:3px;align-items:center;font-size:13px}
.hidden{display:none!important}
nav .cnt{display:inline-block;min-width:18px;margin-left:5px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;line-height:18px}
.req{border-left:4px solid var(--warn)}.req.ok{border-left-color:var(--ok)}.req.no{border-left-color:var(--bad)}.req.done{border-left-color:var(--line);opacity:.85}
.list-click tr{cursor:pointer}.list-click tr:hover td{background:#faf9f6}
@media(max-width:640px){header{padding:9px 12px}nav{top:44px;padding:6px 12px}main{padding:12px}.occ{width:80px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<dialog id="dlg"><div class="h"><span id="dlgT"></span><button class="btn s" onclick="closeDlg()">Kapat</button></div><div class="b" id="dlgB"></div><div class="ft" id="dlgF"></div></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
'use strict'
// VITA Randevu paneli. Yetki veritabanında (RLS); bu sayfa yalnız arayüzdür. Gizli anahtar içermez (anon anahtar herkese açık tasarlanmıştır).
// Şifre e-postasındaki bağlantıyla gelindiyse (URL'de type=recovery), oturum açılsa bile önce yeni şifre ekranı gösterilir.
let RECOVERY = /type=recovery/.test(location.hash + location.search)
const sb = supabase.createClient(window.VITA_CFG.url, window.VITA_CFG.anonKey, { auth: { persistSession: true, autoRefreshToken: true } })
const TZ = 'Europe/Istanbul'
const DAYS = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz']
const KIND = { reformer: 'Reformer', pt: 'PT', diyet: 'Diyet', vita_body: 'VITA BODY', karma: 'Karma paket' }
const ST = { booked: 'Kayıtlı', attended: 'Geldi', no_show: 'Gelmedi', cancelled: 'İptal' }
const S = { view: 'gun', day: today(), svc: '', trainer: '', me: null, role: null, services: [], trainers: [], resources: [] }

// ------------------------------------------------------------ yardımcılar
function today() { return ymd(new Date()) }
function ymd(d) { return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d) }
function hm(iso) { return new Intl.DateTimeFormat('tr-TR', { timeZone: TZ, hour: '2-digit', minute: '2-digit' }).format(new Date(iso)) }
function dayLabel(s) { const d = new Date(s + 'T12:00:00+03:00'); return new Intl.DateTimeFormat('tr-TR', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long' }).format(d) }
function addDays(s, n) { const d = new Date(s + 'T12:00:00+03:00'); d.setUTCDate(d.getUTCDate() + n); return ymd(d) }
function monday(s) { const d = new Date(s + 'T12:00:00+03:00'); const w = (d.getUTCDay() + 6) % 7; return addDays(s, -w) }
function iso(day, time) { return `${day}T${time.length === 5 ? time + ':00' : time}+03:00` }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) }
function svc(code) { return S.services.find(x => x.code === code) || { name: code } }
// 017: diyet ve bölgesel incelme kontenjansız (aynı saate çok danışan, aynı personele çok seans)
const unl = code => !!svc(code).unlimited
const capTag = (s, n) => unl(s.service_code) ? `<span class="tag g">${n} danışan · kontenjansız</span>` : `<span class="tag ${n >= s.capacity ? 'b' : 'g'}">${n}/${s.capacity}${n >= s.capacity ? ' dolu' : ` · ${s.capacity - n} boş`}</span>`
function trn(id) { return S.trainers.find(x => x.id === id)?.name || '—' }
function $(id) { return document.getElementById(id) }
function toast(msg, bad) { const t = $('toast'); t.textContent = msg; t.className = 'on' + (bad ? ' bad' : ''); clearTimeout(t._h); t._h = setTimeout(() => t.className = '', bad ? 6000 : 2600) }
function errText(e) {
  const m = String(e?.message || e || 'Bilinmeyen hata')
  if (m.includes('rv_session_trainer_overlap')) return 'Eğitmenin bu saatte başka dersi var (geçiş süresi dahil).'
  if (m.includes('rv_booking_once')) return 'Danışan bu seansta zaten kayıtlı.'
  if (m.includes('row-level security') || m.includes('RV_FORBIDDEN') || m.includes('permission denied')) return 'Bu işlem için yetkiniz yok.'
  const r = m.match(/RV_[A-Z_]+:\s*(.*)/); if (r) return r[1]
  return m
}
async function q(p) { const { data, error } = await p; if (error) throw error; return data }
async function run(fn, okMsg) { try { const r = await fn(); if (okMsg) toast(okMsg); return r } catch (e) { toast(errText(e), true); throw e } }
function opts(list, val, empty) { return (empty !== undefined ? `<option value="">${esc(empty)}</option>` : '') + list.map(([v, t]) => `<option value="${esc(v)}"${String(v) === String(val ?? '') ? ' selected' : ''}>${esc(t)}</option>`).join('') }
function svcOpts(val, empty) { return opts(S.services.filter(s => s.active).map(s => [s.code, s.name + (s.verified ? '' : ' (teyit bekliyor)')]), val, empty) }
function trnOpts(val, empty, code) { return opts(S.trainers.filter(t => t.active && (!code || !t.services.length || t.services.includes(code))).map(t => [t.id, t.name]), val, empty) }
function dlg(title, body, foot) { $('dlgT').textContent = title; $('dlgB').innerHTML = body; $('dlgF').innerHTML = foot || ''; const d = $('dlg'); if (!d.open) d.showModal() }
function closeDlg() { $('dlg').close() }
function phoneNorm(p) { const d = String(p || '').replace(/\D/g, ''); if (d.length === 10) return '+90' + d; if (d.length === 11 && d[0] === '0') return '+9' + d; if (d.length === 12 && d.startsWith('90')) return '+' + d; return p ? String(p).trim() : null }

// ------------------------------------------------------------ giriş
async function boot() {
  const { data: { session } } = await sb.auth.getSession()
  if (!session) {
    const h = new URLSearchParams(location.hash.slice(1))
    if (h.get('error')) {   // E-posta bağlantısı kullanılmış ya da süresi dolmuş: sessizce giriş ekranına düşme, nedenini söyle
      history.replaceState(null, '', location.pathname)
      return loginView(/expired|invalid/i.test(h.get('error_description') || h.get('error_code') || '')
        ? 'Bu e-posta bağlantısı daha önce kullanılmış ya da süresi dolmuş. Aşağıdan yeniden "Şifremi unuttum"a basın ve en son gelen e-postadaki bağlantıyı yalnız bir kez açın.'
        : 'E-posta bağlantısı açılamadı: ' + (h.get('error_description') || h.get('error')))
    }
    return loginView()
  }
  if (RECOVERY) return setPassword()
  S.me = session.user
  const st = await sb.from('rv_staff').select('role,display_name,active').eq('user_id', S.me.id).maybeSingle()
  if (st.data && st.data.active && st.data.role === 'trainer') {   // 011: eğitmen yalnız kendi seanslarını görür (veritabanı fonksiyonu üzerinden)
    S.role = 'trainer'; S.name = st.data.display_name; S.view = 'tbugun'; trainerShell(); go(S.view)
    if (!S.timer) S.timer = setInterval(() => { if (!document.hidden && !$('dlg').open) go(S.view, true) }, 60000)
    return
  }
  if (!st.data || !st.data.active || !['staff', 'admin'].includes(st.data.role)) {
    $('app').innerHTML = `<div class="login"><div class="card"><h3>Yetki bekleniyor</h3><p class="mute">Bu hesap (${esc(S.me.email)}) randevu paneline henüz yetkilendirilmedi. İşletme sahibinden yetki isteyin.</p><button class="btn" onclick="logout()">Çıkış</button></div></div>`
    return
  }
  S.role = st.data.role; S.name = st.data.display_name
  await loadRef()
  shell(); go(S.view)
  if (!S.timer) {     // boot birden çok kez çağrılsa da yenileme tek kez kurulur
    S.timer = setInterval(() => { if (S.role && !document.hidden && !$('dlg').open) go(S.view, true) }, 60000)
    document.addEventListener('visibilitychange', () => { if (S.role && !document.hidden && !$('dlg').open) go(S.view, true) })
  }
}
function loginView(msg) {
  $('app').innerHTML = `<div class="login"><div class="card">
   <h2 style="margin:0 0 4px">VITA Randevu</h2><p class="mute" style="margin-top:0">Personel girişi</p>
   <form id="lf"><label class="f">E-posta<input id="le" type="email" autocomplete="username" required></label><br>
   <label class="f">Şifre<input id="lp" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required></label>
   <div class="row mute" style="margin:6px 0 10px;justify-content:space-between"><label class="row"><input type="checkbox" id="lshow"> Şifreyi göster</label><span id="lcaps" class="tag w hidden">Caps Lock açık</span></div>
   <button class="btn p" style="width:100%">Giriş</button></form>
   <p><a href="#" id="lr" class="mute">Şifremi unuttum / ilk şifremi belirleyeceğim</a></p>
   <p id="lm" class="mute">${esc(msg || '')}</p></div></div>`
  $('lshow').onchange = () => { $('lp').type = $('lshow').checked ? 'text' : 'password' }
  const caps = e => { if (e.getModifierState) $('lcaps').classList.toggle('hidden', !e.getModifierState('CapsLock')) }
  $('lp').addEventListener('keydown', caps); $('lp').addEventListener('keyup', caps)
  $('lf').onsubmit = async e => {
    e.preventDefault()
    $('le').value = $('le').value.trim().toLowerCase()
    const { error } = await sb.auth.signInWithPassword({ email: $('le').value, password: $('lp').value })
    if (error) {     // Gerçek nedeni söyle: yanlış şifre / şifre hiç belirlenmemiş, onaysız e-posta, çok fazla deneme
      const m = String(error.message || '')
      $('lm').textContent = /invalid login credentials/i.test(m)
        ? 'Giriş başarısız: e-posta ya da şifre hatalı. Şifreniz hiç belirlenmediyse yöneticiniz "Ayarlar → Personel hesapları" bölümünden belirleyebilir.'
        : /email not confirmed/i.test(m) ? 'E-posta adresi henüz onaylanmamış. Yöneticiniz panelden şifrenizi belirleyince hesap onaylanır.'
        : /rate limit|too many/i.test(m) ? 'Çok fazla deneme yapıldı. Birkaç dakika bekleyip tekrar deneyin.'
        : 'Giriş yapılamadı: ' + m
      return
    }
    boot()
  }
  $('lr').onclick = async e => {
    e.preventDefault(); const em = $('le').value.trim(); if (!em) { $('lm').textContent = 'Önce e-posta adresinizi yazın.'; return }
    const { error } = await sb.auth.resetPasswordForEmail(em, { redirectTo: location.origin + location.pathname })
    if (error) {      // Gönderilemediyse "gönderildi" denmez; neden açıkça yazılır.
      const m = String(error.message || '')
      $('lm').textContent = /rate limit|too many|security purposes/i.test(m)
        ? 'E-posta şu an gönderilemedi: kısa sürede çok fazla istek yapıldı. Lütfen 1 saat sonra tekrar deneyin ya da yöneticinizden şifrenizi belirlemesini isteyin.'
        : 'E-posta gönderilemedi (' + m + '). Yöneticinizden şifrenizi belirlemesini isteyin.'
      return
    }
    $('lm').textContent = 'Şifre belirleme bağlantısı e-postanıza gönderildi (hesap varsa). Birkaç dakika içinde gelmezse spam klasörüne bakın; yine yoksa yöneticinize haber verin.'
  }
}
sb.auth.onAuthStateChange((ev) => { if (ev === 'PASSWORD_RECOVERY') { RECOVERY = true; setPassword() } })
const PW_FORM = `<form id="pf"><label class="f">Yeni şifre (en az 8 karakter)<input id="pp" type="password" minlength="8" autocomplete="new-password" required></label><br>
  <label class="f">Yeni şifre (tekrar)<input id="pp2" type="password" minlength="8" autocomplete="new-password" required></label><br><button class="btn p">Şifreyi kaydet</button></form><p id="pm" class="mute"></p>`
async function savePassword(after) {
  if ($('pp').value !== $('pp2').value) { $('pm').textContent = 'İki şifre aynı değil.'; return }
  const { error } = await sb.auth.updateUser({ password: $('pp').value })
  if (error) { $('pm').textContent = errText(error); return }
  RECOVERY = false; history.replaceState(null, '', location.pathname); toast('Şifre kaydedildi. Bundan sonra e-posta ve bu şifreyle girebilirsiniz.'); after()
}
function setPassword() {
  $('app').innerHTML = `<div class="login"><div class="card"><h3>Yeni şifre belirleyin</h3><p class="mute">Bu ekrandan çıkmadan şifrenizi kaydedin; sonraki girişlerde e-posta ve bu şifre kullanılır.</p>${PW_FORM}</div></div>`
  $('pf').onsubmit = e => { e.preventDefault(); savePassword(boot) }
}
function changePassword() {
  dlg('Şifre değiştir', PW_FORM, '')
  $('pf').onsubmit = e => { e.preventDefault(); savePassword(closeDlg) }
}
async function logout() { await sb.auth.signOut(); location.reload() }

async function loadRef() {
  S.services = await q(sb.from('rv_service').select('*').order('sort'))
  S.trainers = await q(sb.from('rv_trainer').select('*').order('name'))
  S.resources = await q(sb.from('rv_resource').select('*').order('name'))
}

function shell() {
  const tabs = [['talep', 'Talepler<span id="tcount"></span>'], ['gun', 'Gün'], ['hafta', 'Hafta'], ['bos', 'Boş yerler'], ['danisan', 'Danışanlar'], ['yoklama', 'Yoklama'], ['paket', 'Paketler<span id="pcount"></span>'], ['ayar', 'Ayarlar'], ['gecmis', 'Geçmiş']]
  $('app').innerHTML = `<header><b>VITA Randevu</b><span class="who">${esc(S.name)} · ${S.role === 'admin' ? 'Yönetici' : 'Personel'}</span><button onclick="changePassword()">Şifre</button><button onclick="logout()">Çıkış</button></header>
  <nav>${tabs.map(([k, t]) => `<button data-v="${k}" onclick="go('${k}')">${t}</button>`).join('')}</nav><main id="m"></main>`
}
function go(v, quiet) {
  S.view = v
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v))
  if (!quiet) $('m').innerHTML = '<p class="mute">Yükleniyor…</p>'
  if (S.role === 'trainer') return ({ tbugun: () => trainerView(0), thafta: () => trainerView(1) }[v] || (() => trainerView(0)))().catch(e => { $('m').innerHTML = `<div class="card">${esc(errText(e))}</div>` })
  talepCount(); pkgCount()
  return ({ yoklama: attendanceView, talep: talepView, gun: dayView, hafta: weekView, bos: freeView, danisan: clientsView, paket: packageAlertsView, ayar: settingsView, gecmis: historyView }[v])().catch(e => { $('m').innerHTML = `<div class="card">${esc(errText(e))}</div>` })
}
function filters() {
  return `<select onchange="S.svc=this.value;go(S.view)">${svcOpts(S.svc, 'Tüm hizmetler')}</select>
          <select onchange="S.trainer=this.value;go(S.view)">${trnOpts(S.trainer, 'Tüm eğitmenler')}</select>`
}
async function sessions(fromDay, toDay, withPeople) {
  let p = sb.from('rv_session').select(withPeople
      ? 'id,service_code,trainer_id,resource_id,starts_at,ends_at,capacity,status,note,rv_booking(id,client_id,status,kind,package_id,series_id,cancel_reason,att_by_name,att_at,att_note,rv_client(full_name,phone))'
      : 'id,service_code,trainer_id,starts_at,ends_at,capacity,status,rv_booking(id,status)')
    .gte('starts_at', iso(fromDay, '00:00')).lt('starts_at', iso(addDays(toDay, 1), '00:00')).eq('status', 'active').order('starts_at')
  if (S.svc) p = p.eq('service_code', S.svc)
  if (S.trainer) p = p.eq('trainer_id', S.trainer)
  return q(p)
}
const live = s => (s.rv_booking || []).filter(b => b.status !== 'cancelled')

// ------------------------------------------------------------ gün
async function dayView() {
  const list = await sessions(S.day, S.day, true)
  const hol = await q(sb.from('rv_holiday').select('note').eq('day', S.day))
  $('m').innerHTML = `<div class="bar"><button class="btn" onclick="S.day=addDays(S.day,-1);go('gun')">‹</button>
   <input type="date" value="${S.day}" onchange="S.day=this.value;go('gun')"><button class="btn" onclick="S.day=addDays(S.day,1);go('gun')">›</button>
   <button class="btn" onclick="S.day=today();go('gun')">Bugün</button><b>${esc(dayLabel(S.day))}</b><span class="grow"></span>${filters()}
   <button class="btn p" onclick="quickBook(S.day)">+ Seans</button></div>
   ${hol.length ? `<div class="card"><span class="tag w">Tatil</span> ${esc(hol[0].note || '')}</div>` : ''}

function sessCard(s) {

  const people = (s.rv_booking || []).filter(b => !(b.status === 'cancelled' && (b.cancel_reason || '').startsWith('danışan pasif'))).sort((a, b) => (a.status === 'cancelled') - (b.status === 'cancelled'))
  return `<div class="card"><div class="row"><b>${hm(s.starts_at)}–${hm(s.ends_at)}</b><span>${esc(svc(s.service_code).name)}</span><span class="mute">${esc(trn(s.trainer_id))}</span>
   <span class="grow" style="flex:1"></span>${u ? '' : `<div class="occ ${n >= s.capacity ? 'full' : ''}"><i style="width:${pct}%"></i></div>`}
   ${capTag(s, n)}</div>
   ${people.map(b => `<div class="part ${b.status === 'cancelled' ? 'c' : ''}"><span class="n">${esc(b.rv_client?.full_name)} ${b.kind === 'makeup' ? '<span class="tag">telafi</span>' : ''} ${b.series_id ? '<span class="tag">seri</span>' : ''}</span>
     <span class="tag ${b.status === 'cancelled' ? 'b' : b.status === 'attended' ? 'g' : ''}">${ST[b.status]}</span>${b.att_by_name && ['attended', 'no_show'].includes(b.status) ? `<span class="mute" style="font-size:12px">${esc(b.att_by_name)}${b.att_note ? ' · ' + esc(b.att_note) : ''}</span>` : ''}
     ${b.status !== 'cancelled' ? `<button class="btn s" onclick="mark('${b.id}','attended')">Geldi</button><button class="btn s" onclick="mark('${b.id}','no_show')">Gelmedi</button>

       <button class="btn s d" onclick="cancelB('${b.id}')">İptal</button>` : ''}</div>`).join('')}

   <button class="btn s" onclick="editSession('${s.id}')">Düzenle</button></div></div>`

// ------------------------------------------------------------ hızlı randevu (14): günlük "+ Randevu" ve haftalık gün/kart tıklaması AYNI fonksiyonu kullanır
// Kayıt sunucudaki mevcut iki fonksiyonla yapılır: rv_session_at (o saatteki seansı bulur, yoksa açar) + rv_book (randevu).
// Kapasite, eğitmen/cihaz çakışması, aynı danışanın aynı saatte ikinci randevusu, aynı derse çift kayıt ve paket hakkı/tarihi veritabanında denetlenir.
// Arayüz ayrıca önceden gösterir: mevcut gruba eklenecek mi, yeni seans mı açılacak, grup dolu mu. Çift tıklamada ikinci gönderim yapılmaz.
async function quickBook(day, time, code) {
  let C = null, busy = false
  dlg('Yeni randevu', `<label class="f">Danışan</label><div id="qbc"></div>
    <div class="grid2" style="margin-top:8px"><label class="f">Hizmet<select id="qbs">${svcOpts(code || S.svc)}</select></label>
    <label class="f">Eğitmen<select id="qbt"></select></label>
    <label class="f">Tarih<input id="qbd" type="date" value="${day || S.day}"></label>
    <label class="f">Başlangıç saati<input id="qbh" type="time" step="300" value="${time || ''}"></label></div>
    <div id="qbp"></div><div id="qbx" style="margin-top:8px"></div>
    <p class="mute" style="margin-top:10px;font-size:13px">Danışan listede yoksa <button class="btn s" id="qbn">Yeni danışan kaydı</button> · Danışansız boş seans için <button class="btn s" id="qbe">Boş seans aç</button>${day ? ` · <button class="btn s" id="qbg">Gün görünümü</button>` : ''}</p>`,
    `<button class="btn" onclick="closeDlg()">Vazgeç</button><button class="btn p" id="qbo" disabled>Randevu oluştur</button>`)
  const v = () => ({ s: $('qbs').value, t: $('qbt').value || null, d: $('qbd').value, h: $('qbh').value })
  let state = {}
  const setTrainers = (keep) => { const cur = keep ?? $('qbt').value, list = S.trainers.filter(t => t.active && (!t.services.length || t.services.includes($('qbs').value)));
    $('qbt').innerHTML = opts(list.map(t => [t.id, t.name]), cur || (list.length === 1 ? list[0].id : ''), 'Eğitmen yok / sonra') }
  const pickUI = () => pickClient('qbc', c => { C = c
    $('qbc').innerHTML = `<div class="part"><span class="n"><b>${esc(c.full_name)}</b> <span class="mute">${esc(c.phone || 'telefon yok')}</span></span><button class="btn s" id="qbch">Değiştir</button></div>`
    $('qbch').onclick = () => { C = null; pickUI(); refresh() }; refresh() })
  async function refresh() {
    const x = v(), btn = $('qbo'); if (!btn) return
    let msg = '', ok = !!C && !!x.s && !!x.d && /^\d\d:\d\d$/.test(x.h || '')
    if (x.h && (x.h < '06:00' || x.h > '23:00')) { ok = false; msg = '<span class="tag b">Geçersiz saat</span>' }
    state = { sess: null, full: false }
    if (x.s && x.d && /^\d\d:\d\d$/.test(x.h || '') && x.h >= '06:00' && x.h <= '23:00') {
      const ss = await q(sb.from('rv_session').select('id,trainer_id,capacity,rv_booking(id,client_id,status,rv_client(full_name))').eq('service_code', x.s).eq('status', 'active').eq('starts_at', new Date(iso(x.d, x.h)).toISOString()))
      const u = unl(x.s)
      const withRoom = u ? (ss.find(s => x.t && s.trainer_id === x.t) || (!x.t ? ss[0] : null)) : ss.find(s => live(s).length < s.capacity), any = u ? withRoom : ss[0]
      if (C && u && ss.some(s => live(s).some(b => b.client_id === C.id))) { ok = false; msg = `<span class="tag b">Bu danışan bu saatte zaten kayıtlı</span>` }
      else if (any) {
        const sx = withRoom || any, ppl = live(sx), names = ppl.map(b => b.rv_client?.full_name).filter(Boolean)
        if (C && ss.some(s => live(s).some(b => b.client_id === C.id))) { ok = false; msg = `<span class="tag b">Bu danışan bu seansta zaten kayıtlı</span>` }
        else if (!withRoom) { ok = false; state.full = true; msg = `<span class="tag b">Grup dolu (${ppl.length}/${sx.capacity})</span> Başka saat seçin.` }
        else { state.sess = sx; msg = `<span class="tag g">${u ? 'Mevcut seansa eklenecek' : 'Mevcut gruba eklenecek'}</span> ${esc(svc(x.s).name)} · ${esc(trn(sx.trainer_id))} · ${u ? `${ppl.length} danışan · kontenjansız` : `${ppl.length}/${sx.capacity}`}${names.length ? ' — ' + esc(names.join(', ')) : ''}`
          if (sx.trainer_id && x.t !== sx.trainer_id) setTrainers(sx.trainer_id) }
      } else msg = `<span class="tag">Yeni seans açılacak</span> ${esc(svc(x.s).name)} ${esc(x.h)} · ${esc(trn(x.t))} · ${u ? 'kontenjansız' : `kapasite ${svc(x.s).capacity}`}`
    }
    $('qbx').innerHTML = msg
    if (C && x.s && x.d) {
      const pk = await q(sb.from('rv_package_status').select('*').eq('client_id', C.id).eq('active', true))
      const fit = pk.filter(p => p.services.includes(x.s) && p.starts_on <= x.d && (!p.ends_on || p.ends_on >= x.d))
      const prev = $('qbpp')?.value
      $('qbp').innerHTML = `<label class="f" style="margin-top:8px">Paket<select id="qbpp">${opts(fit.map(p => [p.id, `${p.package_type} — kalan ${p.total_sessions - p.used - p.reserved}`]), prev && fit.some(p => p.id === prev) ? prev : (fit.find(p => p.total_sessions - p.used - p.reserved > 0) || fit[0])?.id, 'Paketsiz (deneme / tek seans)')}</select></label>
        ${pk.length && !fit.length ? '<p class="mute">Danışanın bu hizmeti ve tarihi kapsayan aktif paketi yok.</p>' : ''}`
    } else $('qbp').innerHTML = ''
    btn.disabled = !ok || busy
  }
  setTrainers(S.trainer); pickUI(); refresh()
  for (const id of ['qbs', 'qbd', 'qbh']) $(id).onchange = () => { if (id === 'qbs') setTrainers(''); refresh() }
  $('qbt').onchange = refresh
  $('qbn').onclick = () => clientForm()
  $('qbe').onclick = () => newSession($('qbd').value, $('qbh').value || undefined, $('qbs').value)
  if ($('qbg')) $('qbg').onclick = () => { closeDlg(); S.day = $('qbd').value; go('gun') }
  $('qbo').onclick = async () => {
    if (busy) return
    busy = true; $('qbo').disabled = true; $('qbo').textContent = 'Kaydediliyor…'
    const x = v(), st = new Date(iso(x.d, x.h)).toISOString(), pkg = $('qbpp')?.value || null
    try {
      await refresh(); if (state.full) throw new Error('Grup dolu')
      const created = !state.sess
      const sid = state.sess && unl(x.s) ? state.sess.id : await q(sb.rpc('rv_session_at', { p_service: x.s, p_trainer: state.sess ? null : x.t, p_resource: null, p_starts: st }))
      try { await q(sb.rpc('rv_book', { p_session: sid, p_client: C.id, p_package: pkg })) }
      catch (e) { if (created) await sb.from('rv_session').update({ status: 'cancelled', note: 'hızlı randevu kaydedilemedi' }).eq('id', sid).eq('status', 'active'); throw e }   // yeni açılan boş seans takvimde kalmaz
      toast(`Randevu oluşturuldu: ${C.full_name} · ${svc(x.s).name} · ${x.d.slice(8)}.${x.d.slice(5, 7)} ${x.h}`)
      closeDlg(); S.day = x.d; go(S.view, true)
    } catch (e) { toast(errText(e), true); busy = false; if ($('qbo')) { $('qbo').textContent = 'Randevu oluştur'; refresh() } }
  }
}

  let busy = false, ss = []

  const target = () => {

  async function doMove(sid, t, h) {

      await run(async () => {
        if (!sid) { sid = await q(sb.rpc('rv_session_at', { p_service: c, p_trainer: t || null, p_resource: null, p_starts: new Date(iso(d, h)).toISOString() }))
          if (!ss.some(s => s.id === sid)) created = sid }
        try { await q(sb.rpc('rv_move_booking', { p_booking: bid, p_session: sid, p_makeup: makeup })) }
        catch (e) { if (created) await sb.from('rv_session').update({ status: 'cancelled', note: 'taşıma kaydedilemedi' }).eq('id', created).eq('status', 'active'); throw e }   // boş seans takvimde kalmaz
      }, okMsg)
      closeDlg(); go(S.view, true)
    } catch { busy = false; showT() }
  }
  const load = async () => {
    const d = $('md').value, c = $('ms').value, u = unl(c)
    ss = await q(sb.from('rv_session').select('id,starts_at,capacity,trainer_id,rv_booking(id,status)').eq('service_code', c).eq('status', 'active').gte('starts_at', iso(d, '00:00')).lt('starts_at', iso(addDays(d, 1), '00:00')).order('starts_at'))
    const free = await q(sb.rpc('rv_free_slots', { p_day: d, p_service: c })).catch(() => [])
    const rows = ss.filter(s => u || live(s).length < s.capacity).map(s => `<div class="part"><span class="n">${hm(s.starts_at)} · ${esc(trn(s.trainer_id))} <span class="tag g">${u ? `${live(s).length} danışan · kontenjansız` : `${s.capacity - live(s).length} boş`}</span></span><button class="btn s p" data-s="${s.id}">Buraya</button></div>`)
    const fr = svc(c).is_group ? [] : free.map(f => `<div class="part"><span class="n">${f.o_start.slice(0, 5)} · ${esc(f.o_trainer_name)} <span class="tag">yeni seans</span></span><button class="btn s p" data-t="${f.o_trainer}" data-h="${f.o_start.slice(0, 5)}">Buraya</button></div>`)
    $('ml').innerHTML = rows.length || fr.length ? `<p class="mute" style="margin:0 0 4px">Hazır yerler:</p>${rows.concat(fr).join('')}` : '<p class="mute">Bu gün hazır seans yok. Yukarıdan saat ve personel seçip <b>Onayla</b>\'ya basın; seans açılır.</p>'
    $('ml').querySelectorAll('button').forEach(b => b.onclick = () => doMove(b.dataset.s || null, b.dataset.t || null, b.dataset.h || null))
    showT()
  }
  $('mok').onclick = () => { const x = target(); if (x.ok) doMove(x.sid || null, x.t, $('mh').value) }
  $('md').onchange = load; $('ms').onchange = () => { setT(); load() }; $('mh').oninput = showT; $('mt').onchange = showT
  setT(); load()
}

const ATT = { booked: '', attended: '✓', no_show: '✗' }
function weekCard(s) {
  const seen = new Set(), ppl = live(s).filter(b => !seen.has(b.client_id) && seen.add(b.client_id)), n = ppl.length
  const names = ppl.map(b => `<li>${esc(b.rv_client?.full_name || '—')} ${ATT[b.status] ? `<span class="tag ${b.status === 'attended' ? 'g' : 'b'}">${ATT[b.status]}</span>` : ''}</li>`).join('')
  const past = new Date(s.starts_at) < new Date(), open = past && ppl.some(b => b.status === 'booked')
  const u = unl(s.service_code)
  return `<div class="s ${!u && n >= s.capacity ? 'full' : n ? 'part' : ''}" title="Bu seansa danışan ekle" onclick="quickBook('${ymd(new Date(s.starts_at))}','${hm(s.starts_at)}','${s.service_code}')"><b>${hm(s.starts_at)}</b> ${esc(svc(s.service_code).name)}<br>
    <span class="mute">${esc(trn(s.trainer_id))} · ${n} danışan${u ? ' · kontenjansız' : ` · ${n}/${s.capacity}${n >= s.capacity ? ' dolu' : ''}`}${open ? ' · <b>yoklama bekliyor</b>' : ''}</span>
    ${n ? (n > 5 ? `<details onclick="event.stopPropagation()"><summary>${n} isim</summary><ol class="wk">${names}</ol></details>` : `<ol class="wk">${names}</ol>`) : ''}</div>`
}

async function clientDetail(id) {
  const c = await q(sb.from('rv_client').select('*').eq('id', id).single())
  const pk = await q(sb.from('rv_package_status').select('*').eq('client_id', id).order('starts_on', { ascending: false }))
  const ser = await q(sb.from('rv_series').select('*').eq('client_id', id).eq('active', true))
  // 10.11: Eskiden oluşturulma sırasına göre ilk 30 kayıt alınıyordu; haftada 3 gün gelen danışanda bazı günler listeden düşebiliyordu.

function whText(w) { return Object.entries(w || {}).sort().map(([d, ws]) => `${DAYS[d - 1]} ${ws.map(x => x.join('–')).join(', ')}`).join(' · ') }
function whParse(txt) {
  // "1: 09:00-12:00, 16:00-21:00" satırları
  const out = {}
  for (const line of txt.split('\n').map(x => x.trim()).filter(Boolean)) {
    const m = line.match(/^([1-7])\s*:\s*(.+)$/); if (!m) throw new Error('Satır biçimi: "1: 09:00-12:00, 16:00-21:00" (1=Pazartesi)')
    out[m[1]] = m[2].split(',').map(x => x.trim().split(/\s*[-–]\s*/)).map(([a, b]) => { if (!/^\d\d:\d\d$/.test(a) || !/^\d\d:\d\d$/.test(b) || a >= b) throw new Error('Saat aralığı hatalı: ' + a + '-' + b); return [a, b] })
  }
  return out
}

    <label class="f">Geçiş süresi (dk)<input id="vb" type="number" value="${s.buffer_min}"></label><label class="f">Kapasite<input id="vc" type="number" value="${s.capacity}"></label>
    <label class="f">Kullandığı cihaz<input id="vu" type="number" min="1" value="${s.units_needed}"></label><label class="f">Teyit<select id="vv">${opts([['true', 'Teyitli'], ['false', 'Teyit bekliyor']], String(s.verified))}</select></label>
    <label class="f">Durum<select id="va">${opts([['true', 'Aktif'], ['false', 'Pasif']], String(s.active))}</select></label>
    <label class="f">Kontenjan<select id="vl">${opts([['false', 'Kontenjanlı'], ['true', 'Kontenjansız (aynı saate çok danışan / seans)']], String(!!s.unlimited))}</select></label></div>
    <p class="mute">Kontenjansız: diyet ve bölgesel incelme gibi; yeni açılan seanslarda geçerli olur.</p>`, `<button class="btn p" id="vok">Kaydet</button>`)
  $('vok').onclick = async () => { await run(() => q(sb.from('rv_service').update({ name: $('vn').value, duration_min: +$('vd').value, buffer_min: +$('vb').value, capacity: +$('vc').value, units_needed: +$('vu').value, verified: $('vv').value === 'true', active: $('va').value === 'true', unlimited: $('vl').value === 'true' }).eq('code', code)), 'Kaydedildi'); closeDlg(); go('ayar') }
}

// ------------------------------------------------------------ geçmiş
const TBL = { rv_booking: 'Randevu', rv_session: 'Seans', rv_client: 'Danışan', rv_package: 'Paket', rv_series: 'Seri', rv_leave: 'İzin', rv_holiday: 'Tatil', rv_trainer: 'Eğitmen', rv_resource: 'Oda/cihaz', rv_service: 'Hizmet', rv_staff: 'Yetki' }
function auditText(a) {
  const n = a.new || {}, o = a.old || {}
  if (a.tbl === 'rv_booking') {
    if (a.action === 'INSERT') return n.kind === 'makeup' ? 'Telafi dersi yazıldı' : 'Danışan seansa eklendi'
    if (o.status !== n.status) return `Durum: ${ST[o.status]} → ${ST[n.status]}${n.cancel_reason ? ` (${n.cancel_reason})` : ''}`
  }
  if (a.tbl === 'rv_session') {
    if (a.action === 'INSERT') return `${svc(n.service_code).name} ${new Date(n.starts_at).toLocaleString('tr-TR', { timeZone: TZ })} oluşturuldu`
    if (o.status !== n.status) return n.status === 'cancelled' ? 'Seans iptal edildi' : 'Seans yeniden açıldı'
    if (o.starts_at !== n.starts_at) return `Saat değişti → ${new Date(n.starts_at).toLocaleString('tr-TR', { timeZone: TZ })}`
  }
  const nm = n.full_name || n.name || n.package_type || o.full_name || o.name || o.package_type || ''
  if (a.action === 'PASSWORD') return `Şifre belirlendi: ${n.display_name || ''}`
  return ({ INSERT: 'Eklendi', UPDATE: 'Güncellendi', DELETE: 'Silindi' }[a.action] || a.action) + (nm ? `: ${nm}` : '')
}
async function historyView() {
  const r = await q(sb.from('rv_audit').select('id,at,actor,tbl,row_id,action,old,new,undone_at').order('id', { ascending: false }).limit(150))
  const st = S.role === 'admin' ? await q(sb.from('rv_staff').select('user_id,display_name')) : []
  const who = id => st.find(x => x.user_id === id)?.display_name || (id === S.me.id ? S.name : '')
  $('m').innerHTML = `<div class="card"><p class="mute" style="margin-top:0">Son 150 işlem. "Geri al" yalnız kayıt o işlemden sonra değişmediyse çalışır; geri alma da kapasite ve çakışma kurallarından geçer.</p><table>
   <tr><th>Zaman</th><th>Tür</th><th>İşlem</th><th>Kim</th><th></th></tr>${r.map(a => `<tr><td class="mute">${new Date(a.at).toLocaleString('tr-TR', { timeZone: TZ })}</td><td>${TBL[a.tbl] || a.tbl}</td><td>${esc(auditText(a))}</td><td class="mute">${esc(who(a.actor))}</td>
   <td>${a.undone_at ? '<span class="tag">geri alındı</span>' : TBL[a.tbl] && !['rv_service', 'rv_staff'].includes(a.tbl) ? `<button class="btn s" onclick="undo(${a.id})">Geri al</button>` : ''}</td></tr>`).join('')}</table></div>`
}
async function undo(id) { await run(() => q(sb.rpc('rv_undo', { p_audit: id })), 'Geri alındı'); go('gecmis', true) }

boot()
</script>
